name: 插件收录或更新申请
description: 提交已经可下载的插件；由维护者审核后收录到社区目录。
title: "[插件收录] "
body:
  - type: input
    id: identity
    attributes:
      label: 插件名称、稳定 ID 与版本
      placeholder: 我的插件 / io.yourname.plugin / 1.0.0
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 功能与效果
      description: 说明用途、效果或截图；更新时说明变化。
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: GitHub 源码地址
    validations:
      required: true
  - type: input
    id: download
    attributes:
      label: 固定 GitHub Release 插件 ZIP 下载地址
      description: 请提供上传的插件 ZIP 附件，不是 Source code.zip 或 latest 链接。
    validations:
      required: true
  - type: input
    id: checksum
    attributes:
      label: 完整 ZIP 的 SHA-256
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 最低宿主版本、权限与数据行为
      description: 说明测试环境、存储与联网、卸载保留、许可，以及你与源码作者的关系。
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我有权提交此插件，已检查说明和附件不含凭据或私人资料。
          required: true
        - label: 我理解申请不会自动安装或上架，需经维护者审核。
          required: true
