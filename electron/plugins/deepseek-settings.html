<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>DeepSeek 连接设置</title><link rel="stylesheet" href="deepseek-settings.css"></head>
<body><main><div class="eyebrow">SpinePet · AI</div><h1>连接 DeepSeek</h1>
<p>填写你在 DeepSeek 开放平台创建的 API Key。</p>
<form id="key-form"><label for="api-key">API Key</label><input id="api-key" type="password" maxlength="512" autocomplete="off" spellcheck="false" placeholder="输入 API Key" required>
<button id="save" type="submit">保存密钥</button></form>
<div class="actions"><button id="test" type="button">测试已保存的连接</button><button id="clear" type="button">移除密钥</button></div>
<p id="status" role="status" aria-live="polite">正在读取连接状态…</p>
<aside>密钥由 Windows 系统加密后保存在本机，不会交给插件。发送消息时，对话上下文、人设和记忆会发送到 DeepSeek 官方服务，费用计入你的账户。</aside>
<p class="endpoint">服务地址：api.deepseek.com</p></main><script src="deepseek-settings.js"></script></body></html>
